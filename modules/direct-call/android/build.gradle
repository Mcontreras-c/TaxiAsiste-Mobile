apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.directcall'
version = '1.0.0'

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
  namespace "expo.modules.directcall"
  compileSdkVersion safeExtGet("compileSdkVersion", 35)

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 35)
  }
}

dependencies {
  // Modulo legacy de React Native puro (ReactContextBaseJavaModule) — a
  // proposito NO usa la API nueva de Expo Modules (Module()/ModuleDefinition),
  // que fallaba en runtime con un error de generics 'reified' de Kotlin
  // (ver historial). Este enfoque es mas verboso pero mucho mas estable
  // para un modulo simple como este.
  implementation "com.facebook.react:react-android"
}
