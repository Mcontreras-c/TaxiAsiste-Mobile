name: CI

on:
  push:
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      # Sin tests todavia (pendiente) -- el chequeo de tipos es la unica
      # verificacion automatizada disponible hoy en este repo.
      - run: npx tsc --noEmit
